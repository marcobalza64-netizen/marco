name: Deploy Meteo Bordighera

on:
  push:
    branches:
      - cursor/meteo-bordighera-0955
      - main
    paths:
      - "meteo/**"
      - ".github/workflows/deploy-meteo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-meteo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload meteo folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: meteo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
